name: A067599 Lean CI

on:
  push:
    branches:
      - research/a067599-round3-ci
      - research/a067599-round3-periodic-divisors
      - research/a067599-round4-axiom-clean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Reject proof escape hatches
        shell: bash
        run: |
          set -euo pipefail
          source_file="research/a067599-ci/A067599CI.lean"
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' "$source_file"; then
            echo "Forbidden proof escape hatch found in Lean source" >&2
            exit 1
          fi
          patch="research/a067599-ci/a067599-squarefree.patch"
          grep '^+' "$patch" | grep -v '^+++' > /tmp/a067599-added-lines.txt
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' /tmp/a067599-added-lines.txt; then
            echo "Forbidden proof escape hatch found in patch additions" >&2
            exit 1
          fi

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        working-directory: research/a067599-ci
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee lean-version.log
          lake --version | tee lake-version.log

      - name: Resolve pinned dependencies
        working-directory: research/a067599-ci
        shell: bash
        run: lake update

      - name: Apply exact source patch to pinned dependency
        working-directory: research/a067599-ci
        shell: bash
        run: |
          set -euo pipefail
          dep=".lake/packages/formal_conjectures"
          patch="$GITHUB_WORKSPACE/research/a067599-ci/a067599-squarefree.patch"
          git -C "$dep" apply --check "$patch"
          git -C "$dep" apply "$patch"
          cp "$dep/FormalConjectures/OEIS/67599.lean" patched-67599.lean

      - name: Download Mathlib cache
        working-directory: research/a067599-ci
        shell: bash
        run: lake exe cache get

      - name: Build patched upstream module
        working-directory: research/a067599-ci
        shell: bash
        run: |
          set -euo pipefail
          lake --wfail build FormalConjectures.OEIS.«67599» 2>&1 | tee target-build.log

      - name: Full lake build
        working-directory: research/a067599-ci
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          lake --wfail build 2>&1 | tee full-build.log

      - name: Audit theorem axioms
        working-directory: research/a067599-ci
        shell: bash
        run: |
          set -euo pipefail
          lake env lean CheckAxioms.lean 2>&1 | tee axioms.log
          if grep -Eq 'sorryAx|native_decide\.ax' axioms.log; then
            echo "A theorem depends on a forbidden proof-generation axiom" >&2
            exit 1
          fi

      - name: Write verification manifest
        if: always()
        working-directory: research/a067599-ci
        shell: bash
        run: |
          {
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_attempt=${{ github.run_attempt }}"
            echo "repository_commit=${{ github.sha }}"
            echo "formal_conjectures_commit=27f7d5b62fb86f586a5432bf2de56f99dc9b0aa6"
            echo "required_toolchain=leanprover/lean4:v4.33.1"
            echo "integration_mode=patch_applied_to_pinned_dependency"
            echo "axiom_policy=no_sorryAx_no_native_decide_axioms"
          } > verification-manifest.txt

      - name: Upload verification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a067599-round4-axiom-clean-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            research/a067599-ci/A067599CI.lean
            research/a067599-ci/CheckAxioms.lean
            research/a067599-ci/a067599-squarefree.patch
            research/a067599-ci/patched-67599.lean
            research/a067599-ci/lakefile.lean
            research/a067599-ci/lean-toolchain
            research/a067599-ci/lake-manifest.json
            research/a067599-ci/lean-version.log
            research/a067599-ci/lake-version.log
            research/a067599-ci/target-build.log
            research/a067599-ci/full-build.log
            research/a067599-ci/axioms.log
            research/a067599-ci/verification-manifest.txt
