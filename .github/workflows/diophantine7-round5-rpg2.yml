name: Diophantine7 Round5 Complete Genus2 Points

on:
  push:
    branches:
      - math-research-diophantine7-round5-20260903

jobs:
  rational-points-genus2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Magma RationalPointsGenus2
        shell: bash
        run: |
          python3 - <<'PY'
          import html, pathlib, time, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET
          root = pathlib.Path('research/diophantine7/round5')
          code = (root / 'rational_points_genus2.m').read_text()
          endpoint = 'https://magma.maths.usyd.edu.au/xml/calculator.xml'
          payload = urllib.parse.urlencode({'input': code}).encode()
          raw = None
          history = []
          for attempt in range(10):
              try:
                  req = urllib.request.Request(endpoint, data=payload, method='POST')
                  req.add_header('Content-Type', 'application/x-www-form-urlencoded')
                  req.add_header('User-Agent', 'diophantine7-round5-research/1.0')
                  with urllib.request.urlopen(req, timeout=240) as response:
                      candidate = response.read()
                  if b'<offline>' in candidate:
                      history.append(candidate.decode(errors='replace'))
                      time.sleep(65)
                      continue
                  raw = candidate
                  break
              except Exception as exc:
                  history.append(repr(exc))
                  time.sleep(35)
          if raw is None:
              raise RuntimeError('Magma request failed: ' + repr(history[-3:]))
          (root / 'magma_rpg2.xml').write_bytes(raw)
          doc = ET.fromstring(raw)
          lines = [html.unescape(node.text or '') for node in doc.findall('.//line')]
          text = '\n'.join(lines) + '\n'
          (root / 'magma_rpg2.log').write_text(text)
          print(text)
          warning = doc.findtext('.//warning')
          alert = doc.findtext('.//alert')
          if warning or alert:
              raise RuntimeError(f'Magma warning={warning!r} alert={alert!r}')
          if 'RPG2_FINISHED' not in text:
              raise RuntimeError('completion sentinel missing')
          PY
      - name: Upload exact result
        uses: actions/upload-artifact@v4
        with:
          name: diophantine7-round5-rpg2
          path: |
            research/diophantine7/round5/rational_points_genus2.m
            research/diophantine7/round5/magma_rpg2.log
            research/diophantine7/round5/magma_rpg2.xml
          if-no-files-found: error
          retention-days: 7
