<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethan (Yuxuan) Xu</title>
    <meta name="description" content="Ethan (Yuxuan) Xu — M.Sc. Computer Science at Georgia Tech.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})()</script>
    <style>
        :root {
            --bg: #d2d0ca;
            --text: #22201c;
            --muted: #6a645c;
            --accent: #585248;
            --line: #b7b0a7;
        }
        [data-theme="dark"] {
            --bg: #262a31;
            --text: #e8ecf2;
            --muted: #95a0b2;
            --accent: #c4ccd8;
            --line: #3b434f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: opacity 0.8s ease, transform 0.8s ease;
            position: relative;
        }
        body.leaving {
            opacity: 0;
            transform: scale(0.98);
        }
        .corner-mark {
            position: fixed;
            top: 2rem;
            left: 2.5rem;
            font-family: 'DM Serif Display', serif;
            font-size: 1.5rem;
            letter-spacing: 0.05em;
            color: var(--accent);
            opacity: 0.8;
        }
        .theme-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            width: 38px;
            height: 38px;
            border: 1px solid var(--line);
            background: transparent;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--muted);
            transition: all 0.3s;
        }
        .theme-toggle:hover {
            color: var(--text);
            border-color: var(--text);
        }
        .theme-toggle svg { width: 16px; height: 16px; }
        .icon-moon { display: none; }
        [data-theme="dark"] .icon-sun { display: none; }
        [data-theme="dark"] .icon-moon { display: block; }

        .center {
            opacity: 0;
            animation: rise 1.2s cubic-bezier(.2,.7,.2,1) 0.2s forwards;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .name {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(3rem, 8vw, 6.5rem);
            line-height: 1.05;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
        }
        .tagline {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--muted);
            letter-spacing: 0.02em;
            margin-bottom: 0.4rem;
        }
        .institution {
            font-size: 1rem;
            color: var(--muted);
            letter-spacing: 0.04em;
            font-weight: 300;
        }
        .divider {
            width: 60px;
            height: 1px;
            background: var(--line);
            margin: 3rem auto 2rem;
        }
        .enter {
            font-size: 0.95rem;
            color: var(--accent);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 0;
            transition: gap 0.3s, color 0.3s;
        }
        .enter:hover { gap: 1rem; color: var(--text); }
        .enter .arrow {
            display: inline-block;
            transition: transform 0.3s;
        }
        body:hover .enter .arrow { transform: translateX(3px); }

        .hint {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.5;
            animation: pulse 2.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        @media (max-width: 640px) {
            .corner-mark { top: 1.25rem; left: 1.25rem; font-size: 1.2rem; }
            .theme-toggle { top: 1rem; right: 1rem; }
            .name { margin-bottom: 1rem; }
        }
    </style>
</head>
<body id="page">
    <div class="corner-mark">XY</div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <div class="center">
        <h1 class="name">Ethan&nbsp;Xu</h1>
        <p class="tagline">M.Sc. Computer Science</p>
        <p class="institution">Georgia Institute of Technology</p>
        <div class="divider"></div>
        <a href="../index.html" class="enter" id="enter">
            <span>Enter Portfolio</span>
            <span class="arrow">→</span>
        </a>
    </div>

    <div class="hint">Click anywhere to enter</div>

    <script>
        const page = document.getElementById('page');
        const enter = document.getElementById('enter');
        const themeBtn = document.getElementById('themeToggle');

        function goToCV(e) {
            if (e && e.target.closest('.theme-toggle')) return;
            e && e.preventDefault();
            page.classList.add('leaving');
            setTimeout(() => { window.location.href = '../index.html'; }, 700);
        }
        page.addEventListener('click', goToCV);

        themeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.removeItem('theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') goToCV(e);
        });
    </script>
</body>
</html>
