name: Diophantine 7-tuple round 5 exact computation

on:
  push:
    branches:
      - research/diophantine7-round5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-computation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: sagemath/sagemath:10.9
    steps:
      - name: Install git and certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y git ca-certificates
      - name: Check out computation script
        uses: actions/checkout@v4
        with:
          ref: research/diophantine7-round5
      - name: Run exact Sage and Magma computations
        run: |
          sage -python research/diophantine7_round5.py | tee round5-computation.log
      - name: Run two reduced elliptic Chabauty curves
        run: |
          python3 - <<'PY' | tee round5-twoquartics.log
          import pathlib, time, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          code=pathlib.Path('research/orbitC_twoquartics.m').read_text()
          data=urllib.parse.urlencode({'input':code}).encode('ascii')
          req=urllib.request.Request('https://magma.maths.usyd.edu.au/xml/calculator.xml',data=data,headers={'Content-Type':'application/x-www-form-urlencoded','Accept':'text/html, application/xml','Referer':'https://magma.maths.usyd.edu.au/calc/','User-Agent':'Mozilla/5.0 exact-research-check'},method='POST')
          for attempt in range(10):
              try:
                  with urllib.request.urlopen(req,timeout=100) as r: raw=r.read().decode('utf-8','replace')
                  root=ET.fromstring(raw)
                  off=root.find('offline')
                  if off is not None:
                      print('OFFLINE',off.text,flush=True); time.sleep(15+5*attempt); continue
                  print(raw)
                  print('\n'.join((n.text or '') for n in root.findall('./results/line')))
                  break
              except Exception as exc:
                  print('ATTEMPT',attempt+1,type(exc).__name__,exc,flush=True); time.sleep(15+5*attempt)
          PY
      - name: Upload raw computation logs
        uses: actions/upload-artifact@v4
        with:
          name: diophantine7-round5-logs
          path: |
            round5-computation.log
            round5-twoquartics.log
          if-no-files-found: error
