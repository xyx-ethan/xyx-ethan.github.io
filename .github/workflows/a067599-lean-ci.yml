name: A067599 Lean CI

on:
  push:
    branches:
      - research/a067599-round3-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Reject proof escape hatches
        shell: bash
        run: |
          set -euo pipefail
          file="research/a067599-ci/A067599CI.lean"
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' "$file"; then
            echo "Forbidden proof escape hatch found" >&2
            exit 1
          fi

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        working-directory: research/a067599-ci
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee lean-version.log
          lake --version | tee lake-version.log

      - name: Resolve pinned dependencies
        working-directory: research/a067599-ci
        shell: bash
        run: lake update

      - name: Download Mathlib cache
        working-directory: research/a067599-ci
        shell: bash
        run: lake exe cache get

      - name: Full lake build
        working-directory: research/a067599-ci
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          lake --wfail build 2>&1 | tee full-build.log

      - name: Audit theorem axioms
        working-directory: research/a067599-ci
        shell: bash
        run: |
          set -euo pipefail
          lake env lean CheckAxioms.lean 2>&1 | tee axioms.log
          if grep -q 'sorryAx' axioms.log; then
            echo "The theorem depends on sorryAx" >&2
            exit 1
          fi

      - name: Write verification manifest
        if: always()
        working-directory: research/a067599-ci
        shell: bash
        run: |
          {
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_attempt=${{ github.run_attempt }}"
            echo "repository_commit=${{ github.sha }}"
            echo "formal_conjectures_commit=27f7d5b62fb86f586a5432bf2de56f99dc9b0aa6"
            echo "required_toolchain=leanprover/lean4:v4.33.1"
          } > verification-manifest.txt

      - name: Upload verification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a067599-round3-lean-verification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            research/a067599-ci/A067599CI.lean
            research/a067599-ci/CheckAxioms.lean
            research/a067599-ci/lakefile.lean
            research/a067599-ci/lean-toolchain
            research/a067599-ci/lake-manifest.json
            research/a067599-ci/lean-version.log
            research/a067599-ci/lake-version.log
            research/a067599-ci/full-build.log
            research/a067599-ci/axioms.log
            research/a067599-ci/verification-manifest.txt
