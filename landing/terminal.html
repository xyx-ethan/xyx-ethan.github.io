<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ethan@gatech:~</title>
    <meta name="description" content="Ethan (Yuxuan) Xu — M.Sc. Computer Science at Georgia Tech.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem('theme');if(t!=='light')document.documentElement.setAttribute('data-theme','dark');})()</script>
    <style>
        :root {
            --desktop-bg: #d2d0ca;
            --term-bg: #1e1f24;
            --term-head: #2a2c32;
            --term-border: #3b434f;
            --term-fg: #e8ecf2;
            --term-dim: #8a93a3;
            --term-muted: #5e6675;
            --term-prompt: #87b88a;
            --term-cmd: #e8ecf2;
            --term-string: #d4b585;
            --term-link: #8db8d8;
            --term-comment: #5e6675;
            --shadow: 0 30px 80px rgba(0,0,0,0.25), 0 12px 30px rgba(0,0,0,0.15);
        }
        [data-theme="dark"] {
            --desktop-bg: #14171c;
            --term-bg: #1a1c20;
            --term-head: #232529;
            --shadow: 0 30px 80px rgba(0,0,0,0.6), 0 12px 30px rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--desktop-bg);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            transition: opacity 0.6s ease;
        }
        body.leaving { opacity: 0; }

        .theme-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            width: 38px;
            height: 38px;
            border: 1px solid var(--term-border);
            background: transparent;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--term-dim);
            transition: all 0.3s;
            z-index: 10;
        }
        .theme-toggle:hover { color: var(--term-fg); border-color: var(--term-fg); }
        .theme-toggle svg { width: 16px; height: 16px; }
        .icon-moon { display: none; }
        [data-theme="dark"] .icon-sun { display: none; }
        [data-theme="dark"] .icon-moon { display: block; }

        .terminal {
            width: 100%;
            max-width: 780px;
            height: min(560px, 80vh);
            background: var(--term-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--term-border);
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            animation: appear 0.7s cubic-bezier(.2,.7,.2,1) 0.15s forwards;
        }
        @keyframes appear {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .term-head {
            background: var(--term-head);
            padding: 0.7rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            border-bottom: 1px solid var(--term-border);
        }
        .dot {
            width: 12px; height: 12px; border-radius: 50%;
        }
        .dot.r { background: #ff5f57; }
        .dot.y { background: #febc2e; }
        .dot.g { background: #28c840; }
        .term-title {
            flex: 1;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--term-dim);
            letter-spacing: 0.05em;
        }
        .term-body {
            flex: 1;
            padding: 1.25rem 1.5rem;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.92rem;
            line-height: 1.65;
            color: var(--term-fg);
        }
        .term-body::-webkit-scrollbar { width: 6px; }
        .term-body::-webkit-scrollbar-thumb { background: var(--term-border); border-radius: 3px; }

        .line { display: block; white-space: pre-wrap; }
        .prompt {
            color: var(--term-prompt);
            font-weight: 500;
        }
        .prompt::after {
            content: ' ';
        }
        .cmd { color: var(--term-cmd); }
        .out { color: var(--term-fg); }
        .dim { color: var(--term-dim); }
        .muted { color: var(--term-muted); }
        .str { color: var(--term-string); }
        .link {
            color: var(--term-link);
            text-decoration: underline;
            cursor: pointer;
            font-weight: 500;
        }
        .link:hover { color: var(--term-cmd); }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.05em;
            background: var(--term-fg);
            vertical-align: text-bottom;
            margin-left: 1px;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        .open-cmd {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            margin-left: 0.2rem;
            border-radius: 4px;
            background: rgba(141, 184, 216, 0.15);
            border: 1px solid rgba(141, 184, 216, 0.4);
            color: var(--term-link);
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            font-weight: 500;
        }
        .open-cmd:hover {
            background: rgba(141, 184, 216, 0.3);
            transform: translateY(-1px);
        }

        @media (max-width: 640px) {
            .term-body { font-size: 0.78rem; padding: 1rem; }
            .terminal { height: 75vh; }
            .theme-toggle { top: 1rem; right: 1rem; }
        }
    </style>
</head>
<body id="page">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <div class="terminal">
        <div class="term-head">
            <span class="dot r"></span>
            <span class="dot y"></span>
            <span class="dot g"></span>
            <span class="term-title">ethan@gatech: ~/portfolio — zsh</span>
        </div>
        <div class="term-body" id="body"></div>
    </div>

    <script>
        const body = document.getElementById('body');
        const page = document.getElementById('page');
        const themeBtn = document.getElementById('themeToggle');

        const script = [
            { type: 'cmd', text: 'whoami' },
            { type: 'out',  text: 'Ethan (Yuxuan) Xu — ML Researcher · Data Scientist' },
            { type: 'spacer' },
            { type: 'cmd', text: 'cat about.md' },
            { type: 'out',  text: 'M.Sc. Computer Science @ Georgia Tech (AI specialization).' },
            { type: 'out',  text: 'Math + Philosophy @ University of Toronto.' },
            { type: 'out',  text: 'Working on ML, computer vision, robotics, and game AI.' },
            { type: 'spacer' },
            { type: 'cmd', text: 'ls portfolio/' },
            { type: 'ls' },
            { type: 'spacer' },
            { type: 'finalcmd' },
        ];

        let idx = 0;
        const typeSpeed = 50;
        const lineDelay = 350;
        const PROMPT_HTML = '<span class="prompt">ethan@gatech:~$</span>';

        function appendLine(html) {
            const div = document.createElement('div');
            div.className = 'line';
            div.innerHTML = html;
            body.appendChild(div);
            body.scrollTop = body.scrollHeight;
            return div;
        }

        function typeInto(node, text, speed, cb) {
            let i = 0;
            const tick = () => {
                if (i <= text.length) {
                    node.innerHTML = text.slice(0, i) + '<span class="cursor"></span>';
                    body.scrollTop = body.scrollHeight;
                    i++;
                    setTimeout(tick, speed);
                } else {
                    node.innerHTML = text;
                    cb();
                }
            };
            tick();
        }

        function step() {
            if (idx >= script.length) return;
            const s = script[idx];

            if (s.type === 'cmd') {
                const line = appendLine(PROMPT_HTML + ' <span class="cmd"></span>');
                const cmdSpan = line.querySelector('.cmd');
                typeInto(cmdSpan, s.text, typeSpeed, () => {
                    idx++;
                    setTimeout(step, lineDelay);
                });
            } else if (s.type === 'out') {
                appendLine('<span class="out">' + s.text + '</span>');
                idx++;
                setTimeout(step, 80);
            } else if (s.type === 'spacer') {
                appendLine('&nbsp;');
                idx++;
                setTimeout(step, 200);
            } else if (s.type === 'ls') {
                const html =
                    '<span class="str">about.md</span>   ' +
                    '<span class="link">skills/</span>   ' +
                    '<span class="link">education/</span>   ' +
                    '<span class="link">coursework/</span>   ' +
                    '<span class="link">projects/</span>   ' +
                    '<span class="link">research/</span>   ' +
                    '<span class="link">experience/</span>   ' +
                    '<span class="str">cv.html</span>';
                appendLine(html);
                idx++;
                setTimeout(step, lineDelay);
            } else if (s.type === 'finalcmd') {
                const line = appendLine(PROMPT_HTML + ' <span class="cmd"></span>');
                const cmdSpan = line.querySelector('.cmd');
                typeInto(cmdSpan, 'open ', typeSpeed, () => {
                    cmdSpan.innerHTML = 'open <a href="../index.html" class="open-cmd" id="enter">cv.html</a><span class="cursor"></span>';
                    document.getElementById('enter').addEventListener('click', goToCV);
                    appendLine('<span class="muted"># ↑ click to enter, or press <span class="str">Enter</span></span>');
                });
            }
        }

        function goToCV(e) {
            e && e.preventDefault();
            page.classList.add('leaving');
            setTimeout(() => { window.location.href = '../index.html'; }, 500);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goToCV(e); }
        });

        themeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.removeItem('theme');
            }
        });

        setTimeout(step, 600);
    </script>
</body>
</html>
