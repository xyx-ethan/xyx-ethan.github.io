name: Diophantine7 Round5 Exact Compute

on:
  push:
    branches:
      - math-research-diophantine7-round5-20260903

jobs:
  exact-compute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run SageMath 10.9 exact reconnaissance
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            sagemath/sagemath:10.9 \
            sage research/diophantine7/round5/basic_recon.sage \
            | tee research/diophantine7/round5/sage_basic.log

      - name: Run Magma V2.29-9 exact reconnaissance
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import pathlib
          import time
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          root = pathlib.Path('research/diophantine7/round5')
          code = (root / 'basic_recon.m').read_text()
          endpoint = 'https://magma.maths.usyd.edu.au/xml/calculator.xml'
          payload = urllib.parse.urlencode({'input': code}).encode()
          last = None
          for attempt in range(8):
              try:
                  req = urllib.request.Request(endpoint, data=payload, method='POST')
                  req.add_header('Content-Type', 'application/x-www-form-urlencoded')
                  req.add_header('User-Agent', 'diophantine7-round5-research/1.0')
                  with urllib.request.urlopen(req, timeout=180) as response:
                      raw = response.read()
                  if b'<offline>' in raw:
                      last = raw
                      time.sleep(65)
                      continue
                  break
              except Exception as exc:
                  last = repr(exc).encode()
                  time.sleep(30)
          else:
              raise RuntimeError('Magma request failed: ' + repr(last))
          (root / 'magma_basic.xml').write_bytes(raw)
          doc = ET.fromstring(raw)
          lines = [html.unescape(node.text or '') for node in doc.findall('.//line')]
          text = '\n'.join(lines) + '\n'
          (root / 'magma_basic.log').write_text(text)
          print(text)
          warning = doc.findtext('.//warning')
          alert = doc.findtext('.//alert')
          if warning or alert:
              raise RuntimeError(f'Magma warning={warning!r} alert={alert!r}')
          if 'ALL_BASIC_ASSERTIONS_PASSED' not in text:
              raise RuntimeError('Magma completion sentinel missing')
          PY

      - name: Upload exact logs
        uses: actions/upload-artifact@v4
        with:
          name: diophantine7-round5-basic
          path: |
            research/diophantine7/round5/sage_basic.log
            research/diophantine7/round5/magma_basic.log
            research/diophantine7/round5/magma_basic.xml
            research/diophantine7/round5/basic_recon.sage
            research/diophantine7/round5/basic_recon.m
          if-no-files-found: error
          retention-days: 7
