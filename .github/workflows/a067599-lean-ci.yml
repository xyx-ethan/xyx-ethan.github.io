name: A067599 Lean CI

on:
  push:
    branches:
      - research/a067599-round3-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Reject proof escape hatches
        shell: bash
        run: |
          set -euo pipefail
          file="research/a067599-ci/A067599CI.lean"
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' "$file"; then
            echo "Forbidden proof escape hatch found" >&2
            exit 1
          fi

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        working-directory: research/a067599-ci
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version

      - name: Resolve pinned dependencies
        working-directory: research/a067599-ci
        shell: bash
        run: lake update

      - name: Download Mathlib cache
        working-directory: research/a067599-ci
        shell: bash
        run: lake exe cache get

      - name: Full lake build
        working-directory: research/a067599-ci
        shell: bash
        run: lake --wfail build

      - name: Audit theorem axioms
        working-directory: research/a067599-ci
        shell: bash
        run: |
          set -euo pipefail
          lake env lean CheckAxioms.lean | tee axioms.log
          if grep -q 'sorryAx' axioms.log; then
            echo "The theorem depends on sorryAx" >&2
            exit 1
          fi
