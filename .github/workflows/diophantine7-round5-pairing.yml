name: Diophantine7 Round5 Pairing-Field Descent

on:
  push:
    branches:
      - math-research-diophantine7-round5-20260903

jobs:
  pairing-descent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Magma pairing-field factorization and partial descent
        shell: bash
        run: |
          python3 - <<'PY'
          import html, pathlib, time, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET
          root = pathlib.Path('research/diophantine7/round5')
          code = (root / 'pairing_descent.m').read_text()
          endpoint = 'https://magma.maths.usyd.edu.au/xml/calculator.xml'
          payload = urllib.parse.urlencode({'input': code}).encode()
          raw = None
          errors = []
          for attempt in range(12):
              try:
                  req = urllib.request.Request(endpoint, data=payload, method='POST')
                  req.add_header('Content-Type', 'application/x-www-form-urlencoded')
                  req.add_header('User-Agent', 'diophantine7-round5-research/1.0')
                  with urllib.request.urlopen(req, timeout=240) as response:
                      candidate = response.read()
                  if b'<offline>' in candidate:
                      errors.append(candidate.decode(errors='replace'))
                      time.sleep(65)
                      continue
                  raw = candidate
                  break
              except Exception as exc:
                  errors.append(repr(exc))
                  time.sleep(35)
          if raw is None:
              raise RuntimeError('Magma request failed: ' + repr(errors[-3:]))
          (root / 'magma_pairing_descent.xml').write_bytes(raw)
          doc = ET.fromstring(raw)
          lines = [html.unescape(node.text or '') for node in doc.findall('.//line')]
          text = '\n'.join(lines) + '\n'
          (root / 'magma_pairing_descent.log').write_text(text)
          print(text)
          if 'PAIRING_RECON_FINISHED' not in text:
              raise RuntimeError('completion sentinel missing')
          PY
      - name: Upload exact result
        uses: actions/upload-artifact@v4
        with:
          name: diophantine7-round5-pairing-descent
          path: |
            research/diophantine7/round5/pairing_descent.m
            research/diophantine7/round5/magma_pairing_descent.log
            research/diophantine7/round5/magma_pairing_descent.xml
          if-no-files-found: error
          retention-days: 7
