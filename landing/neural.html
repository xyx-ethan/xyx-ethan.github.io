<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethan (Yuxuan) Xu</title>
    <meta name="description" content="Ethan (Yuxuan) Xu — M.Sc. Computer Science at Georgia Tech.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})()</script>
    <style>
        :root {
            --bg: #d2d0ca;
            --text: #22201c;
            --muted: #6a645c;
            --accent: #585248;
            --line: #b7b0a7;
            --node: 88, 82, 72;
            --edge: 88, 82, 72;
        }
        [data-theme="dark"] {
            --bg: #1c2028;
            --text: #e8ecf2;
            --muted: #95a0b2;
            --accent: #c4ccd8;
            --line: #3b434f;
            --node: 196, 204, 216;
            --edge: 150, 165, 185;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body {
            position: relative;
            transition: opacity 0.7s ease;
        }
        body.leaving { opacity: 0; }

        canvas#net {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, var(--bg) 95%);
            opacity: 0.7;
            pointer-events: none;
            z-index: 1;
        }

        .corner-mark {
            position: fixed;
            top: 2rem;
            left: 2.5rem;
            font-family: 'DM Serif Display', serif;
            font-size: 1.5rem;
            letter-spacing: 0.05em;
            color: var(--accent);
            opacity: 0.8;
            z-index: 10;
        }
        .theme-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            width: 38px;
            height: 38px;
            border: 1px solid var(--line);
            background: rgba(0,0,0,0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--muted);
            transition: all 0.3s;
            z-index: 10;
            backdrop-filter: blur(8px);
        }
        .theme-toggle:hover { color: var(--text); border-color: var(--text); }
        .theme-toggle svg { width: 16px; height: 16px; }
        .icon-moon { display: none; }
        [data-theme="dark"] .icon-sun { display: none; }
        [data-theme="dark"] .icon-moon { display: block; }

        .center {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 5;
            padding: 2rem;
            opacity: 0;
            animation: rise 1.3s cubic-bezier(.2,.7,.2,1) 0.3s forwards;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .name {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(3rem, 8vw, 6.5rem);
            line-height: 1.05;
            letter-spacing: -0.02em;
            margin-bottom: 1.25rem;
        }
        .tagline {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--muted);
            letter-spacing: 0.04em;
            margin-bottom: 0.3rem;
        }
        .institution {
            font-size: 0.95rem;
            color: var(--muted);
            letter-spacing: 0.06em;
            font-weight: 300;
            margin-bottom: 2.5rem;
        }
        .enter-btn {
            position: relative;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: var(--text);
            background: transparent;
            border: 1px solid var(--accent);
            border-radius: 999px;
            padding: 0.85rem 2rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            overflow: hidden;
            transition: color 0.3s, gap 0.3s, transform 0.3s;
        }
        .enter-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--accent);
            transform: translateX(-101%);
            transition: transform 0.4s cubic-bezier(.4,0,.2,1);
            z-index: -1;
        }
        .enter-btn:hover {
            color: var(--bg);
            gap: 1rem;
            transform: translateY(-2px);
        }
        .enter-btn:hover::before { transform: translateX(0); }
        .enter-btn span { position: relative; z-index: 1; }

        .pulse {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            border: 1px solid var(--accent);
            opacity: 0;
            animation: pulse 2.5s ease-out infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        @media (max-width: 640px) {
            .corner-mark { top: 1.25rem; left: 1.25rem; font-size: 1.2rem; }
            .theme-toggle { top: 1rem; right: 1rem; }
        }
    </style>
</head>
<body id="page">
    <canvas id="net"></canvas>
    <div class="vignette"></div>

    <div class="corner-mark">XY</div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <div class="center">
        <h1 class="name">Ethan Xu</h1>
        <p class="tagline">M.Sc. Computer Science · Machine Learning</p>
        <p class="institution">Georgia Institute of Technology</p>
        <a href="../index.html" class="enter-btn" id="enter">
            <span>Enter Portfolio</span>
            <span>→</span>
            <span class="pulse"></span>
        </a>
    </div>

    <script>
        const canvas = document.getElementById('net');
        const ctx = canvas.getContext('2d');
        let W, H, dpr;
        let nodes = [];
        const NODE_COUNT_BASE = 70;
        let mouseX = -9999, mouseY = -9999;

        function resize() {
            dpr = window.devicePixelRatio || 1;
            W = canvas.clientWidth = window.innerWidth;
            H = canvas.clientHeight = window.innerHeight;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            initNodes();
        }

        function initNodes() {
            const target = Math.round(NODE_COUNT_BASE * Math.min(1.6, (W * H) / (1280 * 720)));
            nodes = [];
            for (let i = 0; i < target; i++) {
                nodes.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    vx: (Math.random() - 0.5) * 0.25,
                    vy: (Math.random() - 0.5) * 0.25,
                    r: 1.1 + Math.random() * 1.8,
                });
            }
        }

        function readColor(varName) {
            const root = getComputedStyle(document.documentElement);
            return root.getPropertyValue(varName).trim();
        }

        function tick() {
            const nodeRGB = readColor('--node');
            const edgeRGB = readColor('--edge');
            ctx.clearRect(0, 0, W, H);

            for (const n of nodes) {
                n.x += n.vx;
                n.y += n.vy;
                if (n.x < 0 || n.x > W) n.vx *= -1;
                if (n.y < 0 || n.y > H) n.vy *= -1;
                const dx = n.x - mouseX, dy = n.y - mouseY;
                const md = Math.hypot(dx, dy);
                if (md < 130) {
                    n.x += (dx / md) * 0.5;
                    n.y += (dy / md) * 0.5;
                }
            }

            const maxDist = 130;
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const a = nodes[i], b = nodes[j];
                    const dx = a.x - b.x, dy = a.y - b.y;
                    const d = Math.hypot(dx, dy);
                    if (d < maxDist) {
                        const alpha = (1 - d / maxDist) * 0.35;
                        ctx.strokeStyle = `rgba(${edgeRGB}, ${alpha})`;
                        ctx.lineWidth = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.stroke();
                    }
                }
            }

            for (const n of nodes) {
                ctx.fillStyle = `rgba(${nodeRGB}, 0.7)`;
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
                ctx.fill();
            }
            requestAnimationFrame(tick);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        window.addEventListener('mouseleave', () => { mouseX = -9999; mouseY = -9999; });
        resize();
        tick();

        const page = document.getElementById('page');
        const enter = document.getElementById('enter');
        const themeBtn = document.getElementById('themeToggle');

        function goToCV(e) {
            e && e.preventDefault();
            page.classList.add('leaving');
            setTimeout(() => { window.location.href = '../index.html'; }, 600);
        }
        enter.addEventListener('click', goToCV);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goToCV(e); }
        });

        themeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.removeItem('theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        });
    </script>
</body>
</html>
