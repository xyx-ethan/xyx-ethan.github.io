name: Fano lower-bound Round 27 code-level kernel v8

on:
  push:
    branches:
      - scratch/fano-lower-bound-round27-codelevel-v4-2026-09-03
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-codelevel-v8:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: scratch/fano-lower-bound-round27-codelevel-v4-2026-09-03
          fetch-depth: 1

      - name: Materialize and patch exact Round 27 source payload
        working-directory: FanoLowerBoundRound12
        run: |
          set -euo pipefail
          PARTS="round27_codelevel_payload/part-00.b64 round27_codelevel_payload/part-01.b64 round27_codelevel_payload/part-02.b64 round27_codelevel_payload/part-03.b64 round27_codelevel_payload/part-04.b64 round27_codelevel_payload/part-05.b64"
          cat $PARTS | base64 --decode > /tmp/round27_payload.tar.gz
          echo 'd60bcff02be625eebbe988eaf70640ccaf9a07d0b918969e0003417803e2f43b  /tmp/round27_payload.tar.gz' | sha256sum --check
          tar -xzf /tmp/round27_payload.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          p = Path('FanoLowerBound/FanoForcingTable.lean')
          s = p.read_text(encoding='utf-8')
          old = '''theorem lineContains3_reverse {a b c : Nat}
              (h : lineContains3 a b c = true) :
              lineContains3 c b a = true := by
            simp only [lineContains3, Bool.and_eq_true, decide_eq_true_eq] at h ⊢
            constructor
            · simpa [List.nodup_cons, and_comm, and_left_comm, and_assoc] using h.1
            · simpa [Bool.and_comm, Bool.and_left_comm, Bool.and_assoc] using h.2
          '''
          new = '''theorem lineContains3_reverse {a b c : Nat}
              (h : lineContains3 a b c = true) :
              lineContains3 c b a = true := by
            simp only [lineContains3, Bool.and_eq_true] at h ⊢
            constructor
            · rw [decide_eq_true_eq]
              have hn : [a, b, c].Nodup := of_decide_eq_true h.1
              have hnr := hn.reverse
              change [c, b, a].Nodup at hnr
              exact hnr
            · simpa [Bool.and_comm, Bool.and_left_comm, Bool.and_assoc] using h.2
          '''
          if old not in s:
              raise SystemExit('lineContains3_reverse source block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          echo 'f1425d5b7fb3564ee2c14f6d097760031cded872857de6b7e43966f71b6ff9b1  FanoLowerBound/CodeLevelFano.lean' | sha256sum --check
          echo '009bc6658f5ae489af1809ea017e88feac367a8d7031ca24907d1f94de657b7e  FanoLowerBound/FanoForcingTable.lean' | sha256sum --check
          echo '217f7fc11b1ebba62ec551d9990f048ad6b2ae5aca97d2aab6844ea14ce6dff8  FanoLowerBound/FanoRadonForcing.lean' | sha256sum --check
          echo '74a7fe3eced4c37a995e08c22294ac4d356c7afebd294a6abccf866779865862  FanoLowerBound/GeneralPositionSelection.lean' | sha256sum --check
          echo 'd9b25452f6f2aa2c28801f5cb45a158e501918525227c49d655f2746a45824dc  FanoLowerBound.lean' | sha256sum --check
          grep -q 'theorem no_openConvex_R3_realization_of_FP' FanoLowerBound/CodeLevelFano.lean
          grep -q 'decide (\[a, b, c\].Nodup)' FanoLowerBound/FanoForcingTable.lean

      - name: Audit direct Lean source tree
        working-directory: FanoLowerBoundRound12
        run: |
          set -euo pipefail
          if grep -R -nE '(^|[^[:alnum:]_])(sorry|admit|by\?|exact\?|unsafe)([^[:alnum:]_]|$)' . --include='*.lean'; then
            echo 'forbidden Lean placeholder or unsafe declaration found' >&2
            exit 1
          fi
          if grep -R -nE '^[[:space:]]*axiom[[:space:]]+' . --include='*.lean'; then
            echo 'custom axiom declaration found' >&2
            exit 1
          fi
          find . -maxdepth 2 -name '*.lean' -print0 | sort -z | xargs -0 sha256sum > LEAN_SOURCE_SHA256SUMS_ROUND27_CODELEVEL_V8

      - name: Install pinned Elan
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/elan.tar.gz
          echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  /tmp/elan.tar.gz' | sha256sum --check
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build pinned Lean and Mathlib code-level certificate
        working-directory: FanoLowerBoundRound12
        run: |
          set -euo pipefail
          set -o pipefail
          {
            echo '=== pinned inputs ==='
            cat lean-toolchain
            cat lakefile.toml
            elan toolchain install "$(cat lean-toolchain)"
            lean --version
            lake --version
            lake update
            lake exe cache get
            echo '=== lake build ==='
            lake build
            echo '=== root re-elaboration and axiom report ==='
            lake env lean FanoLowerBound.lean
            echo 'LEAN_LOWER_BOUND_ROUND27_CODELEVEL_V8_PASS'
          } 2>&1 | tee LEAN_LOWER_BOUND_BUILD_ROUND27_CODELEVEL_V8.log
          ! grep -q 'sorryAx' LEAN_LOWER_BOUND_BUILD_ROUND27_CODELEVEL_V8.log
          ! grep -q '_native.native_decide.ax' LEAN_LOWER_BOUND_BUILD_ROUND27_CODELEVEL_V8.log

      - name: Upload kernel evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fano-lower-bound-round27-codelevel-v8-kernel-evidence
          path: |
            FanoLowerBoundRound12/LEAN_LOWER_BOUND_BUILD_ROUND27_CODELEVEL_V8.log
            FanoLowerBoundRound12/lake-manifest.json
            FanoLowerBoundRound12/LEAN_SOURCE_SHA256SUMS_ROUND27_CODELEVEL_V8
            FanoLowerBoundRound12/FanoLowerBound.lean
            FanoLowerBoundRound12/FanoLowerBound/CodeLevelFano.lean
            FanoLowerBoundRound12/FanoLowerBound/FanoForcingTable.lean
            FanoLowerBoundRound12/FanoLowerBound/FanoRadonForcing.lean
            FanoLowerBoundRound12/FanoLowerBound/GeneralPositionSelection.lean
          if-no-files-found: warn
          compression-level: 6
