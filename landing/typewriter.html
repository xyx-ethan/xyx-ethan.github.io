<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethan (Yuxuan) Xu</title>
    <meta name="description" content="Ethan (Yuxuan) Xu — M.Sc. Computer Science at Georgia Tech.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})()</script>
    <style>
        :root {
            --bg: #d2d0ca;
            --text: #22201c;
            --muted: #6a645c;
            --accent: #585248;
            --line: #b7b0a7;
            --cursor: #585248;
        }
        [data-theme="dark"] {
            --bg: #262a31;
            --text: #e8ecf2;
            --muted: #95a0b2;
            --accent: #c4ccd8;
            --line: #3b434f;
            --cursor: #95a0b2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.4,0,.2,1);
        }
        body.leaving {
            opacity: 0;
            transform: scale(1.05);
        }
        .corner-mark {
            position: fixed;
            top: 2rem;
            left: 2.5rem;
            font-family: 'DM Serif Display', serif;
            font-size: 1.5rem;
            letter-spacing: 0.05em;
            color: var(--accent);
            opacity: 0.8;
        }
        .theme-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            width: 38px;
            height: 38px;
            border: 1px solid var(--line);
            background: transparent;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--muted);
            transition: all 0.3s;
        }
        .theme-toggle:hover { color: var(--text); border-color: var(--text); }
        .theme-toggle svg { width: 16px; height: 16px; }
        .icon-moon { display: none; }
        [data-theme="dark"] .icon-sun { display: none; }
        [data-theme="dark"] .icon-moon { display: block; }

        .wrap {
            max-width: 720px;
            width: 100%;
        }
        .greet {
            font-size: clamp(1rem, 2vw, 1.15rem);
            color: var(--muted);
            letter-spacing: 0.04em;
            margin-bottom: 0.75rem;
            opacity: 0;
            animation: fadein 0.6s ease 0.2s forwards;
        }
        .name {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(2.75rem, 7vw, 5rem);
            line-height: 1.05;
            letter-spacing: -0.02em;
            margin-bottom: 1.75rem;
            opacity: 0;
            animation: fadein 0.8s ease 0.6s forwards;
        }
        @keyframes fadein {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .typewriter-line {
            font-size: clamp(1.25rem, 2.5vw, 1.6rem);
            font-weight: 400;
            color: var(--text);
            display: flex;
            align-items: center;
            min-height: 2.4em;
            flex-wrap: wrap;
            gap: 0.4em;
            opacity: 0;
            animation: fadein 0.6s ease 1.2s forwards;
        }
        .typewriter-prefix {
            color: var(--muted);
            font-weight: 300;
        }
        .typewriter-word {
            color: var(--accent);
            font-weight: 500;
            border-right: 2px solid var(--cursor);
            padding-right: 4px;
            min-width: 1ch;
            min-height: 1em;
            display: inline-block;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 50% { border-color: var(--cursor); }
            51%, 100% { border-color: transparent; }
        }

        .enter-wrap {
            margin-top: 3.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .enter-wrap.show {
            opacity: 1;
            transform: translateY(0);
        }
        .enter-btn {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: var(--bg);
            background: var(--text);
            border: none;
            border-radius: 999px;
            padding: 0.85rem 1.5rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            transition: gap 0.3s, transform 0.3s;
        }
        .enter-btn:hover {
            gap: 1rem;
            transform: translateY(-2px);
        }
        .enter-hint {
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        kbd {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: transparent;
            color: var(--muted);
            margin: 0 0.2rem;
        }

        @media (max-width: 640px) {
            .corner-mark { top: 1.25rem; left: 1.25rem; font-size: 1.2rem; }
            .theme-toggle { top: 1rem; right: 1rem; }
            .enter-wrap { flex-direction: column; align-items: flex-start; gap: 1rem; }
        }
    </style>
</head>
<body id="page">
    <div class="corner-mark">XY</div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <div class="wrap">
        <p class="greet">Hi, I'm</p>
        <h1 class="name">Ethan Xu.</h1>
        <div class="typewriter-line">
            <span class="typewriter-prefix">I work on</span>
            <span class="typewriter-word" id="tw"></span>
        </div>
        <div class="enter-wrap" id="enterWrap">
            <a href="../index.html" class="enter-btn" id="enter">
                <span>Enter Portfolio</span>
                <span>→</span>
            </a>
            <span class="enter-hint">or press <kbd>Enter</kbd></span>
        </div>
    </div>

    <script>
        const phrases = [
            'Machine Learning',
            'Computer Vision',
            'Game AI',
            'Robotics',
            'Data Science',
            'Research at Georgia Tech'
        ];
        const tw = document.getElementById('tw');
        const enterWrap = document.getElementById('enterWrap');
        const page = document.getElementById('page');
        const enter = document.getElementById('enter');
        const themeBtn = document.getElementById('themeToggle');

        let phraseIdx = 0, charIdx = 0, deleting = false, completedCycles = 0;
        const typeSpeed = 75, deleteSpeed = 35, pause = 1200;

        function loop() {
            const word = phrases[phraseIdx];
            if (deleting) {
                tw.textContent = word.slice(0, charIdx - 1);
                charIdx--;
                if (charIdx === 0) {
                    deleting = false;
                    phraseIdx = (phraseIdx + 1) % phrases.length;
                    if (phraseIdx === 0) completedCycles++;
                    if (completedCycles >= 1 && !enterWrap.classList.contains('show')) {
                        enterWrap.classList.add('show');
                    }
                    setTimeout(loop, 220);
                } else {
                    setTimeout(loop, deleteSpeed);
                }
            } else {
                tw.textContent = word.slice(0, charIdx + 1);
                charIdx++;
                if (charIdx === word.length) {
                    deleting = true;
                    setTimeout(loop, pause);
                } else {
                    setTimeout(loop, typeSpeed);
                }
            }
        }
        setTimeout(loop, 1600);

        function goToCV(e) {
            if (e && e.target.closest('.theme-toggle')) return;
            e && e.preventDefault();
            page.classList.add('leaving');
            setTimeout(() => { window.location.href = '../index.html'; }, 600);
        }
        enter.addEventListener('click', goToCV);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                goToCV(e);
            }
        });

        themeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.removeItem('theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        });
    </script>
</body>
</html>
