name: Diophantine7 Round5 Class1 Single-Prime Chabauty

on:
  push:
    branches:
      - math-research-diophantine7-round5-20260903

jobs:
  single-prime:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        prime: [5, 7, 11, 17, 19, 31, 37, 53, 59, 61]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Magma Chabauty at one prime
        shell: bash
        env:
          PTEST: ${{ matrix.prime }}
        run: |
          python3 - <<'PY'
          import html, os, pathlib, time, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET
          root = pathlib.Path('research/diophantine7/round5')
          p = os.environ['PTEST']
          code = (root / 'class1_single_prime_chabauty.m').read_text().replace('__PTEST__', p)
          endpoint = 'https://magma.maths.usyd.edu.au/xml/calculator.xml'
          payload = urllib.parse.urlencode({'input': code}).encode()
          raw = None
          errors = []
          for attempt in range(15):
              try:
                  req = urllib.request.Request(endpoint, data=payload, method='POST')
                  req.add_header('Content-Type', 'application/x-www-form-urlencoded')
                  req.add_header('User-Agent', f'diophantine7-round5-prime-{p}/1.0')
                  with urllib.request.urlopen(req, timeout=240) as response:
                      candidate = response.read()
                  if b'<offline>' in candidate:
                      errors.append(candidate.decode(errors='replace'))
                      time.sleep(65)
                      continue
                  raw = candidate
                  break
              except Exception as exc:
                  errors.append(repr(exc))
                  time.sleep(35)
          if raw is None:
              raise RuntimeError('Magma request failed: ' + repr(errors[-3:]))
          (root / f'magma_class1_p{p}.xml').write_bytes(raw)
          doc = ET.fromstring(raw)
          lines = [html.unescape(node.text or '') for node in doc.findall('.//line')]
          text = '\n'.join(lines) + '\n'
          (root / f'magma_class1_p{p}.log').write_text(text)
          print(text)
          warning = doc.findtext('.//warning')
          alert = doc.findtext('.//alert')
          if warning or alert:
              raise RuntimeError(f'Magma warning={warning!r} alert={alert!r}')
          if 'SINGLE_PRIME_FINISHED' not in text:
              raise RuntimeError('completion sentinel missing')
          PY
      - name: Upload exact result
        uses: actions/upload-artifact@v4
        with:
          name: diophantine7-round5-class1-p${{ matrix.prime }}
          path: |
            research/diophantine7/round5/class1_single_prime_chabauty.m
            research/diophantine7/round5/magma_class1_p${{ matrix.prime }}.log
            research/diophantine7/round5/magma_class1_p${{ matrix.prime }}.xml
          if-no-files-found: error
          retention-days: 7
